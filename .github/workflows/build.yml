name: Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private source ref (branch/tag/sha)'
        required: false
        default: 'master'
  repository_dispatch:
    types: [ build-uid ]
  push:
    tags:
      - 'oss-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Resolve source ref
        id: ref
        run: |
          REF="${{ github.event.inputs.source_ref || github.event.client_payload.source_ref || 'master' }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch private source
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SOURCE_REF: ${{ steps.ref.outputs.ref }}
        run: bash scripts/fetch_source.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Write signing config
        env:
          KEY_STORE:        ${{ secrets.KEY_STORE }}
          STORE_PASSWORD:   ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:        ${{ secrets.ALIAS }}
          KEY_PASSWORD:     ${{ secrets.ALIAS_KEY_PASSWORD }}
        run: |
          cd src
          echo officialBuild=true >> local.properties
          echo "storePassword=${STORE_PASSWORD}" >> local.properties
          echo "keyAlias=${KEY_ALIAS}" >> local.properties
          echo "keyPassword=${KEY_PASSWORD}" >> local.properties
          echo "fileDir=$(pwd)/key.jks" >> local.properties
          echo "${KEY_STORE}" | base64 --decode > key.jks

      - name: Prepare migration payload
        env:
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ALIAS }}
        run: |
          cd src
          KEY_STORE_PASSWORD="$STORE_PASSWORD" bash tools/prepare_migration.sh "$KEY_ALIAS"
      - name: Host unit tests
        run: bash src/tools/run_tests.sh
      - name: Prebuild
        run: cd src && ./gradlew prebuild --no-daemon

      - name: Build manager apk
        run: cd src && ./gradlew :app:assemble --no-daemon

      - name: Build zygisk module
        id: module
        run: |
          cd src
          ./gradlew :zygote:assemble --no-daemon
          RAW=$(ls zygote/build/outputs/magisk/release/*.zip | head -1)
          DBG=$(ls zygote/build/outputs/magisk/debug/*.zip | head -1)
          # Overlay the reviewed ARM64-only installer, inject the migration
          # payload, regenerate the checksum manifest, and emit the final zip.
          OUT="$PWD/$(dirname "$RAW")/$(basename "$RAW" .zip).zip"
          python3 tools/finalize_module.py \
            --zip "$RAW" \
            --helper build/migration/helper.dex \
            --cert build/migration/manager-cert.der \
            --output "$OUT"
          REL="$OUT"
          # upload-artifact runs at repo root, source lives under src/
          echo "rel=src/$REL" >> "$GITHUB_OUTPUT"
          echo "dbg=src/$DBG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$REL" .zip)" >> "$GITHUB_OUTPUT"

      - name: Collect manager apk
        id: apk
        run: |
          APK=$(ls src/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || ls src/app/build/outputs/apk/debug/*.apk | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hma-oss-uid-${{ steps.module.outputs.name }}
          path: |
            ${{ steps.module.outputs.rel }}
            ${{ steps.module.outputs.dbg }}
            ${{ steps.apk.outputs.apk }}

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/oss-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.module.outputs.rel }}
            ${{ steps.module.outputs.dbg }}
            ${{ steps.apk.outputs.apk }}
          fail_on_unmatched_files: true
